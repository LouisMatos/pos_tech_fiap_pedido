apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlapp-pedido-deployment
spec:
  selector:
    matchLabels:
      app: jlapp-pedido
  replicas: 1
  template:
    metadata:
      labels:
        app: jlapp-pedido
    spec:
      serviceAccountName: pedido-sa
      containers:
      - name: jlapp-pedido
        image: jlapp-pedido:latest
#        imagePullPolicy: Never
        ports:
        - containerPort: 8070
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8070
          initialDelaySeconds: 25
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8070
          initialDelaySeconds: 35
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 20
        env:
          - name: JAVA_OPTS
            value: "-server -Xmx1024M -Xms512M -Xss128m -XX:+UseParallelGC -XX:MaxRAMPercentage=75 -XX:ActiveProcessorCount=2 -XX:+UnlockExperimentalVMOptions"
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://$(SPRING_DATASOURCE_HOST):$(SPRING_DATASOURCE_PORT)/$(SPRING_DATASOURCE_DB)
          - name: SPRING_DATASOURCE_HOST
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: host } }
          - name: SPRING_DATASOURCE_PORT
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: port } }
          - name: SPRING_DATASOURCE_DB
            value: pedido
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: username } }
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: password } }
          - name: SPRING_RABBITMQ_HOST
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: host } }
          - name: SPRING_RABBITMQ_PORT
            value: "5671"
          - name: SPRING_RABBITMQ_USERNAME
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: username } }
          - name: SPRING_RABBITMQ_PASSWORD
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: password } }