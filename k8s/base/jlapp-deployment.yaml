apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlapp-pedido-deployment
spec:
  selector:
    matchLabels:
      app: jlapp-pedido
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: jlapp-pedido
    spec:
      serviceAccountName: pedido-sa
      terminationGracePeriodSeconds: 45
      containers:
      - name: jlapp-pedido
        image: jlapp-pedido
#        imagePullPolicy: Never
        ports:
        - containerPort: 8070
        lifecycle:
          preStop:
            exec:
              # da tempo do ALB desregistrar o target antes do SIGTERM
              command: ["sh", "-c", "sleep 10"]
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8070
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8070
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8070
          periodSeconds: 20
        env:
          - name: JAVA_OPTS
            value: "-server -Xmx1024M -Xms512M -Xss128m -XX:+UseParallelGC -XX:MaxRAMPercentage=75 -XX:ActiveProcessorCount=2 -XX:+UnlockExperimentalVMOptions"
          - name: SPRING_DATASOURCE_URL
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: url } }
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: username } }
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom: { secretKeyRef: { name: pedido-db-secret, key: password } }
          - name: SPRING_RABBITMQ_HOST
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: host } }
          - name: SPRING_RABBITMQ_PORT
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: port } }
          - name: SPRING_RABBITMQ_USERNAME
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: username } }
          - name: SPRING_RABBITMQ_PASSWORD
            valueFrom: { secretKeyRef: { name: shared-mq-secret, key: password } }
          - name: SPRING_RABBITMQ_SSL_ENABLED
            value: "true"
