name: Deploy

# Deploy manual dedicado. Nunca dispara sozinho - so via "Run workflow" (workflow_dispatch).
# CI (ci.yml) testa/publica a imagem automaticamente; fazer deploy em qualquer
# ambiente (dev/hom/prod) e sempre acao humana.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        type: choice
        options:
          - dev
          - hom
          - prod
      image_tag:
        description: 'Tag da imagem ja publicada no ECR (ex: SHA do commit)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_pedido
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Confirma imagem existe no ECR
        run: |
          aws ecr describe-images --repository-name jlapp-pedido --image-ids imageTag="${{ inputs.image_tag }}" > /dev/null

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name jlapp-cluster-${{ inputs.environment }}

      - name: Sync DB/MQ secrets from Secrets Manager
        run: |
          ENV="${{ inputs.environment }}"
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "jlapp-cluster-${ENV}-pedido-db-credentials" --query SecretString --output text)
          MQ_SECRET=$(aws secretsmanager get-secret-value --secret-id "jlapp-cluster-${ENV}-mq-mq-credentials" --query SecretString --output text)

          DB_HOST=$(echo "$DB_SECRET" | jq -r .host)
          echo "::add-mask::$DB_HOST"
          DB_PORT=$(echo "$DB_SECRET" | jq -r .port)
          echo "::add-mask::$DB_PORT"
          DB_NAME=$(echo "$DB_SECRET" | jq -r .dbname)
          echo "::add-mask::$DB_NAME"
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r .username)
          echo "::add-mask::$DB_USERNAME"
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r .password)
          echo "::add-mask::$DB_PASSWORD"

          MQ_HOST=$(echo "$MQ_SECRET" | jq -r .host)
          echo "::add-mask::$MQ_HOST"
          MQ_USERNAME=$(echo "$MQ_SECRET" | jq -r .username)
          echo "::add-mask::$MQ_USERNAME"
          MQ_PASSWORD=$(echo "$MQ_SECRET" | jq -r .password)
          echo "::add-mask::$MQ_PASSWORD"

          kubectl create secret generic pedido-db-secret \
            --from-literal=url="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}" \
            --from-literal=username="${DB_USERNAME}" \
            --from-literal=password="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic shared-mq-secret \
            --from-literal=host="${MQ_HOST}" \
            --from-literal=username="${MQ_USERNAME}" \
            --from-literal=password="${MQ_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set IRSA role arn in overlay
        run: |
          ROLE_ARN="${{ secrets.PEDIDO_IRSA_ROLE_ARN }}"
          sed -i "s#REPLACE_IRSA_ROLE_ARN#$ROLE_ARN#" k8s/overlays/${{ inputs.environment }}/service-account-patch.yaml

      - name: Set image tag in overlay
        run: |
          IMAGE_REPO="${{ steps.login-ecr.outputs.registry }}/jlapp-pedido"
          cat >> k8s/overlays/${{ inputs.environment }}/kustomization.yaml <<EOF
          images:
            - name: jlapp-pedido
              newName: ${IMAGE_REPO}
              newTag: ${{ inputs.image_tag }}
          EOF

      - name: Deploy via Kustomize
        run: |
          kubectl apply -k k8s/overlays/${{ inputs.environment }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jlapp-pedido-deployment -n default --timeout=120s
