name: Deploy to AWS EKS

on:
  push:
    branches: [ "develop", "main" ]
    tags: [ "v*" ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Postman/**'

permissions:
  contents: read
  id-token: write   # necessario para OIDC (aws-actions/configure-aws-credentials)

jobs:

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven
      - run: mvn verify

  build:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven
      - name: Package
        run: mvn package -DskipTests

  # Resolve o ambiente alvo a partir do gatilho: develop->dev, main->hom, tag v*->prod.
  resolve-env:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=hom" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=" >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: needs.resolve-env.outputs.environment != ''
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_pedido
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: image
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/jlapp-pedido:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: [resolve-env, publish]
    if: needs.resolve-env.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_pedido
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name jlapp-cluster-${{ needs.resolve-env.outputs.environment }}

      - name: Sync DB/MQ secrets from Secrets Manager
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "jlapp-cluster-${ENV}-pedido-db-credentials" --query SecretString --output text)
          MQ_SECRET=$(aws secretsmanager get-secret-value --secret-id "jlapp-cluster-${ENV}-mq-mq-credentials" --query SecretString --output text)

          DB_HOST=$(echo "$DB_SECRET" | jq -r .host)
          echo "::add-mask::$DB_HOST"
          DB_PORT=$(echo "$DB_SECRET" | jq -r .port)
          echo "::add-mask::$DB_PORT"
          DB_NAME=$(echo "$DB_SECRET" | jq -r .dbname)
          echo "::add-mask::$DB_NAME"
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r .username)
          echo "::add-mask::$DB_USERNAME"
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r .password)
          echo "::add-mask::$DB_PASSWORD"

          MQ_HOST=$(echo "$MQ_SECRET" | jq -r .host)
          echo "::add-mask::$MQ_HOST"
          MQ_USERNAME=$(echo "$MQ_SECRET" | jq -r .username)
          echo "::add-mask::$MQ_USERNAME"
          MQ_PASSWORD=$(echo "$MQ_SECRET" | jq -r .password)
          echo "::add-mask::$MQ_PASSWORD"

          kubectl create secret generic pedido-db-secret \
            --from-literal=url="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}" \
            --from-literal=username="${DB_USERNAME}" \
            --from-literal=password="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic shared-mq-secret \
            --from-literal=host="${MQ_HOST}" \
            --from-literal=username="${MQ_USERNAME}" \
            --from-literal=password="${MQ_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set IRSA role arn in overlay
        run: |
          ROLE_ARN="${{ secrets.PEDIDO_IRSA_ROLE_ARN }}"
          sed -i "s#REPLACE_IRSA_ROLE_ARN#$ROLE_ARN#" k8s/overlays/${{ needs.resolve-env.outputs.environment }}/service-account-patch.yaml

      - name: Set image tag in overlay
        run: |
          IMAGE_FULL="${{ needs.publish.outputs.image }}"
          IMAGE_REPO="${IMAGE_FULL%:*}"
          IMAGE_TAG="${IMAGE_FULL##*:}"
          cat >> k8s/overlays/${{ needs.resolve-env.outputs.environment }}/kustomization.yaml <<EOF
          images:
            - name: jlapp-pedido
              newName: ${IMAGE_REPO}
              newTag: ${IMAGE_TAG}
          EOF

      - name: Deploy via Kustomize
        run: |
          kubectl apply -k k8s/overlays/${{ needs.resolve-env.outputs.environment }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jlapp-pedido-deployment -n default --timeout=120s
